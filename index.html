<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0b14">
<title>KpopZone</title>
<style>
:root{--bg:#0d0b14;--s1:#171324;--s2:#211a33;--bd:#2d2545;--tx:#f4effa;--mu:#9d93b5;--p:#ff4d8d;--v:#8b5cf6;--g:linear-gradient(135deg,#ff4d8d,#8b5cf6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(600px 320px at 85% -5%,rgba(139,92,246,.28),transparent),radial-gradient(500px 300px at 0% 12%,rgba(255,77,141,.2),transparent)}
.bar{position:sticky;top:0;z-index:5;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(13,11,20,.78);border-bottom:1px solid var(--bd)}
.bar .in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-weight:800;font-size:21px;letter-spacing:-.5px;cursor:pointer}
.logo b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:var(--mu);font:inherit;font-size:14px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer}
nav button.on{background:var(--s2);color:var(--tx)}
.w{max-width:960px;margin:0 auto;padding:16px 16px 40px}
h1,h2,h3{margin:0}
.mu{color:var(--mu)}.note{color:var(--mu);font-size:13px}
.title{font-size:30px;line-height:1.15;font-weight:800;margin:10px 0 6px;letter-spacing:-.8px}
.title span{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.search{position:relative;margin-top:14px}
.search input{width:100%;padding:14px 16px 14px 44px;border-radius:16px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font-size:16px;outline:none}
.search input:focus{border-color:var(--p)}
.search i{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-style:normal;opacity:.6}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--s1);color:var(--mu);padding:8px 16px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--g);color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-top:14px}
.ph{background:var(--g) center top/cover;color:#fff;display:grid;place-items:center;font-weight:800}
.gc{position:relative;border:0;padding:0;border-radius:20px;overflow:hidden;aspect-ratio:3/4;cursor:pointer;color:#fff;text-align:left;font:inherit;background:var(--s2)}
.gc .ph{position:absolute;inset:0;font-size:52px}
.gc .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88),transparent 58%)}
.gc .tx{position:absolute;left:12px;right:12px;bottom:11px}
.gc b{display:block;font-size:17px;line-height:1.2}.gc small{opacity:.8;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--s1);border:1px solid var(--bd);color:var(--tx);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.btn:disabled{opacity:.5}
.hero{position:relative;border-radius:24px;overflow:hidden;padding:20px;margin:14px 0;border:1px solid var(--bd);background:var(--s1)}
.hero .bg{position:absolute;inset:-30px;background:var(--g) center/cover;filter:blur(30px) brightness(.55);opacity:.95}
.hero .c{position:relative;display:flex;gap:16px;align-items:center}
.hero.m .c{flex-direction:column;text-align:center}
.pic{width:118px;height:118px;border-radius:22px;flex:none;border:3px solid rgba(255,255,255,.18);font-size:42px}
.pic.round{width:168px;height:168px;border-radius:50%;font-size:58px}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:12px 14px}
.st small{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.7px}
.st b{font-size:16px}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:28px 0 4px}
.sec h2{font-size:20px;font-weight:800}
.mcard{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:14px 8px;text-align:center;color:inherit;font:inherit;cursor:pointer}
.mcard:active,.mcard:hover{border-color:var(--p)}
.mcard .ph{width:84px;height:84px;border-radius:50%;margin:0 auto 8px;font-size:30px}
.mcard b{display:block}.mcard small{display:block;color:var(--mu);font-size:12px;line-height:1.3}
.nw{background:var(--s1);border:1px solid var(--bd);border-left:4px solid var(--p);border-radius:16px;padding:12px 14px;margin:10px 0}
.nw.issue{border-left-color:#f59f00}.nw.activity{border-left-color:var(--v)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;padding:2px 9px;border-radius:999px;background:var(--p);color:#fff;margin-bottom:4px}
.nw.issue .tag{background:#f59f00}.nw.activity .tag{background:var(--v)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:20px}
.empty{padding:30px 10px;text-align:center}
</style></head>

function fmt(d){if(!d)return"-";return new Date(d+"T00:00:00").toLocaleDateString("en-US",{day:"numeric",month:"long",year:"numeric"})}
function age(d){if(!d)return"-";var b=new Date(d+"T00:00:00"),n=new Date(),a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a+" years old"}
function cat(g){var p=(AG[g.co]||{}).parent||g.co;if(p==="HYBE")return"HYBE";if(/^JYP/.test(p))return"JYP";if(/^SM/.test(p))return"SM";if(/^YG/.test(p))return"YG";return"Others"}
function stat(l,v){return h("div",{class:"st"},[h("small",{textContent:l}),h("b",{textContent:String(v||"-")})])}
function initials(n){return n.split(/[\s\/]+/).map(function(w){return w[0]}).join("").slice(0,3).toUpperCase()}
function agencyList(){var m={};G.forEach(function(g){(m[g.co]=m[g.co]||[]).push(g)});return Object.keys(m).map(function(k){return{name:k,acts:m[k]}}).sort(function(a,b){return b.acts.length-a.acts.length||a.name.localeCompare(b.name)})}

// ====== NAVIGATION (phone back button works) ======
function go(p){location.hash="#"+p.map(function(x){return encodeURIComponent(x)}).join("/")}
function route(){
  var p=location.hash.slice(1).split("/").map(decodeURIComponent);
  window.scrollTo(0,0);
  document.getElementById("t1").className=p[0]==="a"?"":"on";
  document.getElementById("t2").className=p[0]==="a"?"on":"";
  var g=G.find(function(x){return x.name===p[1]});
  if(p[0]==="g"&&g)return detail(g);
  if(p[0]==="m"&&g&&g.mem[+p[2]])return memberPage(g,+p[2]);
  if(p[0]==="a")return p[1]&&G.some(function(x){return x.co===p[1]})?agency(p[1]):agencies();
  home();
}
window.onhashchange=route;

// ====== PHOTOS: auto-loaded from Wikipedia ======
async function wikiImg(q){
  if(q in imgs)return imgs[q];
  try{
    var u="https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(q)+"&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=500&format=json&origin=*";
    var d=await (await fetch(u)).json();
    var p=d.query&&Object.values(d.query.pages)[0];
    var s=p&&p.thumbnail?p.thumbnail.source:"";
    imgs[q]=s;save("kz_img",imgs);return s;
  }catch(e){return ""}
}
function paint(el,q,label){
  el.textContent=label?label[0]:"";
  wikiImg(q).then(function(s){if(s){el.style.backgroundImage='url("'+s+'")';el.textContent=""}});
  return el;
}
function gq(g){return g.type==="Soloist"?g.name+" singer":g.name+" K-pop group"}
function mq(g,m){return g.type==="Soloist"?gq(g):m.n+" "+g.name+" member"}

// ====== AI (only for latest news + searching new groups) ======
function getKey(){
  var k=localStorage.getItem("kpop_key");
  if(!k){k=prompt("Paste your Anthropic API key (stored only in this browser):");if(k)localStorage.setItem("kpop_key",k.trim())}
  return k&&k.trim();
}
async function askAI(prompt){
  var key=getKey();if(!key)throw new Error("No API key");
  var r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
    "content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01",
    "anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:MODEL,max_tokens:2000,messages:[{role:"user",content:prompt}],
      tools:[{type:"web_search_20250305",name:"web_search"}]})});
  var d=await r.json();
  if(!r.ok){if(r.status===401)localStorage.removeItem("kpop_key");throw new Error(d.error&&d.error.message||"Error")}
  var text=d.content.filter(function(c){return c.type==="text"}).map(function(c){return c.text}).join("\n");
  return JSON.parse(text.match(/[\[{][\s\S]*[\]}]/)[0]);
}

// ====== ACT CARD (group or soloist) ======
function actCard(g){
  var ph=h("div",{class:"ph"});paint(ph,gq(g),g.name);
  var sub=g.type==="Soloist"?"Soloist · "+g.debut:g.mem.length+" members · "+g.debut;
  return h("button",{class:"gc",onclick:function(){go(["g",g.name])}},[ph,h("div",{class:"ov"}),
    h("div",{class:"tx"},[h("b",{textContent:g.name}),h("small",{textContent:sub})])]);
}

// ====== SCREEN: ALL ACTS ======
function home(){
  app.replaceChildren();
  var inp=h("input",{placeholder:"Search groups & soloists…",type:"search"});
  var chips=h("div",{class:"chips"});
  var grid=h("div",{class:"grid"});
  var solo=G.filter(function(g){return g.type==="Soloist"}).length;
  app.append(
    h("div",{class:"title"},["Discover your next ",h("span",{textContent:"favorite act"})]),
    h("div",{class:"mu",textContent:(G.length-solo)+" groups · "+solo+" soloists · "+agencyList().length+" agencies"}),
    h("div",{class:"search"},[h("i",{textContent:"🔍"}),inp]),chips,grid);
  function draw(){
    var v=inp.value.trim().toLowerCase();grid.replaceChildren();grid.style.display="";
    chips.replaceChildren();
    ["All","Groups","Soloists","HYBE","JYP","SM","YG","Others"].forEach(function(c){
      chips.append(h("button",{class:"chip"+(c===flt?" on":""),textContent:c,onclick:function(){flt=c;draw()}}))});
    var list=G.filter(function(g){
      var ok=flt==="All"||(flt==="Groups"&&g.type==="Group")||(flt==="Soloists"&&g.type==="Soloist")||cat(g)===flt;
      return ok&&g.name.toLowerCase().indexOf(v)>-1});
    list.forEach(function(g){grid.append(actCard(g))});
    if(!list.length){
      grid.style.display="block";
      grid.append(h("div",{class:"empty mu",textContent:"Nothing found."}));
      if(v){var b=h("button",{class:"btn",textContent:"Search “"+inp.value.trim()+"” with AI",onclick:function(){addAI(inp.value.trim(),b)}});grid.append(h("div",{style:"text-align:center"},[b]))}
    }
  }
  inp.oninput=draw;draw();
}
async function addAI(name,btn){
  btn.disabled=true;btn.textContent="AI is searching…";
  try{
    var r=await askAI('Give info about the K-pop group named "'+name+'". Reply ONLY with JSON: {"found":true,"name":"","co":"agency","debut":2020,"fan":"fandom name","mem":["stage names of members"]}. If the group does not exist or you are not sure, set found=false. Do not make things up.');
    if(r.found&&r.mem&&r.mem.length){
      var g={name:r.name||name,co:r.co||"-",debut:r.debut||"-",fan:r.fan||"-",type:"Group",mem:r.mem.map(function(n){return{n:n,real:"",born:"",pos:""}})};
      G.push(g);extra.push(g);save("kz_groups",extra);go(["g",g.name]);
    }else btn.textContent="AI couldn't find this group";
  }catch(e){btn.disabled=false;btn.textContent="Failed: "+e.message}
}

// ====== SCREEN: AGENCIES ======
function agencies(){
  app.replaceChildren();
  var list=agencyList(),grid=h("div",{class:"grid"});
  list.forEach(function(a){
    var ph=h("div",{class:"ph",textContent:initials(a.name)});
    var par=(AG[a.name]||{}).parent;
    grid.append(h("button",{class:"mcard",onclick:function(){go(["a",a.name])}},[ph,h("b",{textContent:a.name}),
      h("small",{textContent:a.acts.length+(a.acts.length>1?" acts":" act")+(par?" · "+par:"")})]));
  });
  app.append(h("div",{class:"title"},["Entertainment ",h("span",{textContent:"agencies"})]),
    h("div",{class:"mu",textContent:list.length+" agencies"}),grid);
}
function agency(name){
  app.replaceChildren();
  var I=AG[name]||{},acts=G.filter(function(g){return g.co===name});
  var grid=h("div",{class:"grid"});acts.forEach(function(g){grid.append(actCard(g))});
  app.append(
    h("button",{class:"pill",textContent:"← All agencies",onclick:function(){go(["a"])}}),
    h("div",{class:"hero"},[h("div",{class:"bg"}),h("div",{class:"c"},[h("div",{class:"ph pic",textContent:initials(name)}),
      h("div",{},[h("h1",{textContent:name}),h("div",{class:"mu",textContent:I.parent?"Part of "+I.parent:"Independent label"})])])]),
    h("div",{class:"stats"},[stat("Founded",I.founded),stat("Founder",I.founder),stat("Parent company",I.parent||"-"),stat("Acts here",acts.length)]),
    h("div",{class:"sec"},[h("h2",{textContent:"Artists"})]),grid);
}

// ====== SCREEN: GROUP / SOLOIST DETAIL ======
function detail(g){
  app.replaceChildren();
  var solo=g.type==="Soloist",m0=g.mem[0]||{};
  var nb=h("div");
  var upd=h("button",{class:"btn",textContent:news[g.name]?"Refresh news":"Load latest news",onclick:function(){loadNews(g,nb,upd)}});
  var bg=h("div",{class:"bg"}),pic=h("div",{class:"ph pic"});
  paint(bg,gq(g),"");paint(pic,gq(g),g.name);
  app.append(
    h("button",{class:"pill",textContent:"← Back",onclick:function(){history.back()}}),
    h("div",{class:"hero"},[bg,h("div",{class:"c"},[pic,h("div",{},[h("h1",{textContent:g.name}),
      h("button",{class:"pill",style:"margin-top:8px",textContent:"🏢 "+g.co,onclick:function(){go(["a",g.co])}})])])]),
    h("div",{class:"stats"},solo?
      [stat("Type","Soloist"),stat("Debut",g.debut),stat("Real name",m0.real),stat("Birthday",fmt(m0.born)),stat("Age",age(m0.born)),stat("Position",m0.pos),stat("Fandom",g.fan),stat("Agency",g.co)]:
      [stat("Debut",g.debut),stat("Fandom",g.fan),stat("Members",g.mem.length),stat("Agency",g.co)]));
  if(!solo)app.append(
    h("div",{class:"sec"},[h("h2",{textContent:"Members"})]),
    h("div",{class:"grid"},g.mem.map(function(m,i){
      var ph=h("div",{class:"ph"});paint(ph,mq(g,m),m.n);
      return h("button",{class:"mcard",onclick:function(){go(["m",g.name,i])}},[ph,h("b",{textContent:m.n}),h("small",{textContent:m.pos||""})]);
    })));
  app.append(
    h("div",{class:"sec"},[h("h2",{textContent:"Latest News"}),upd]),
    h("div",{class:"note",textContent:"Found and written by AI using web search. Always check official sources."}),
    nb);
  if(news[g.name])showNews(news[g.name],nb);
}

// ====== SCREEN: MEMBER DETAIL ======
function memberPage(g,i){
  var m=g.mem[i];app.replaceChildren();
  var prev=g.mem[i-1],next=g.mem[i+1];
  var bg=h("div",{class:"bg"}),pic=h("div",{class:"ph pic round"});
  paint(bg,mq(g,m),"");paint(pic,mq(g,m),m.n);
  app.append(
    h("button",{class:"pill",textContent:"← "+g.name,onclick:function(){go(["g",g.name])}}),
    h("div",{class:"hero m"},[bg,h("div",{class:"c"},[pic,h("div",{},[h("h1",{textContent:m.n}),h("div",{class:"mu",textContent:g.name+" · "+g.co})])])]),
    h("div",{class:"stats"},[stat("Real name",m.real),stat("Birthday",fmt(m.born)),stat("Age",age(m.born)),stat("Position",m.pos)]),
    h("div",{class:"nav"},[
      prev?h("button",{class:"pill",textContent:"← "+prev.n,onclick:function(){go(["m",g.name,i-1])}}):h("span"),
      next?h("button",{class:"pill",textContent:next.n+" →",onclick:function(){go(["m",g.name,i+1])}}):h("span")]));
}

// ====== LATEST NEWS ======
function showNews(list,box){
  box.replaceChildren();
  list.forEach(function(n){var t=["album","issue","activity"].indexOf(n.type)>-1?n.type:"activity";
    box.append(h("div",{class:"nw "+t},[
      h("span",{class:"tag",textContent:t.toUpperCase()}),
      h("div",{},[h("b",{textContent:n.title})]),h("div",{textContent:n.summary}),
      h("small",{class:"note",textContent:n.date||""})]))});
}
async function loadNews(g,box,btn){
  btn.disabled=true;btn.textContent="AI is searching…";
  try{
    var r=await askAI('Find the latest news about the K-pop act '+g.name+': new albums/comebacks, new issues/controversies, and other activities. Reply ONLY with a JSON array of at most 5 items: [{"type":"album"|"issue"|"activity","title":"","summary":"1-2 sentences in English","date":"date/month"}]. Do not make things up.');
    news[g.name]=r;save("kz_news_en",news);showNews(r,box);btn.textContent="Refresh news";
  }catch(e){box.textContent="Failed: "+e.message;btn.textContent="Try again"}
  btn.disabled=false;
}
route();
</script></body></html>
